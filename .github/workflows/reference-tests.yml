name: Optional reference adapter tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pinned scientific test references
        run: python -m pip install rdkit==2026.3.3 biopython==1.87
      - name: Test reference runner
        run: python -m unittest discover -s benchmarks/reference -p test_runner.py
      - name: Test RDKit adapters
        run: python -m unittest discover -s benchmarks/reference/rdkit -p 'test_*.py'
      - name: Test Biopython adapters
        run: python -m unittest discover -s benchmarks/reference/biopython -p 'test_*.py'
