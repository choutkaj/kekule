name: Manual bounded fuzzing

on:
  workflow_dispatch:
    inputs:
      target:
        description: Fuzz target
        required: true
        default: smiles
        type: choice
        options:
          - mol_v2000
          - mol_v3000
          - sdf_v2000
          - smiles
          - resonance
          - smarts
          - smarts_match
          - mmcif
          - pdb
          - xyz
          - trajectory_detection
          - trajectory_xyz
          - trajectory_dcd
          - trajectory_trr
          - trajectory_xtc

permissions:
  contents: read

concurrency:
  group: fuzz-${{ inputs.target }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      - name: Seed SMILES targets with the supplied PubChem smoke inputs
        if: inputs.target == 'smiles' || inputs.target == 'resonance'
        env:
          TARGET: ${{ inputs.target }}
        run: |
          mkdir -p "fuzz/corpus/$TARGET"
          cp crates/kekule/tests/fixtures/corpus/smoke/data/pubchem_smiles/*.txt "fuzz/corpus/$TARGET/"
      - name: Run bounded campaign
        env:
          TARGET: ${{ inputs.target }}
        run: cargo +nightly fuzz run "$TARGET" -- -max_total_time=300 -max_len=65536
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ inputs.target }}
          path: fuzz/artifacts/${{ inputs.target }}/
          if-no-files-found: ignore
          retention-days: 1
