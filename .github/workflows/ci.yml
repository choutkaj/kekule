name: CI

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msrv:
    name: Minimum supported Rust (1.89)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89.0
      - run: cargo check --workspace --all-targets --all-features --locked

  checks:
    name: Linux checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: cargo check --manifest-path fuzz/Cargo.toml --bins --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Runs unit, integration and documentation tests, including the README
      # examples of kekule and kekule-openff.
      - run: cargo test --workspace --all-features --locked
      - name: Check atomic-data generator output paths
        run: python3 -m unittest discover -s tools/atomic-data -p test_generate.py
      - name: Check shipped OpenFF data provenance
        run: python3 -m unittest discover -s tools/openff -p "test_*.py"
      - name: Check bundled component template provenance
        run: python3 -m unittest discover -s tools/components -p "test_*.py"
      - name: Check benchmark datasets, comparison and triage
        run: python3 -m unittest discover -s benchmarks/tests -p "test_*.py"
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked
      # Each optional feature set of the OpenFF crates. The all-features runs
      # above cover the defaults, which enable every feature.
      - run: cargo clippy -p kekule-potentials --all-targets --no-default-features --locked -- -D warnings
      - run: cargo clippy -p kekule-openff --all-targets --no-default-features --locked -- -D warnings
      - run: cargo test -p kekule-potentials --no-default-features --locked
      - run: cargo test -p kekule-openff --no-default-features --locked
      - run: RUSTDOCFLAGS="-D warnings" cargo doc -p kekule-potentials --no-default-features --no-deps --locked
      - run: RUSTDOCFLAGS="-D warnings" cargo doc -p kekule-openff --no-default-features --no-deps --locked
      - name: Check packaged license copies
        run: |
          for package in kekule kekule-potentials kekule-traj kekule-openff kekule-openff-ash; do
            cmp LICENSE-APACHE "crates/$package/LICENSE-APACHE"
            cmp LICENSE-MIT "crates/$package/LICENSE-MIT"
          done
      # Workspace packaging resolves unpublished member versions from the
      # packages it builds, so every crate is built and verified as uploaded.
      # Integration tests are not shipped, so cargo notes each ignored test.
      - run: cargo package --workspace --exclude kekule-bench --locked
      - name: Check package sizes against the crates.io limit
        shell: bash
        run: |
          limit=10485760
          warn=$((limit * 9 / 10))
          status=0
          for crate in target/package/*.crate; do
            size=$(stat -c %s "$crate")
            percent=$((size * 100 / limit))
            echo "$(basename "$crate"): $size bytes ($percent% of $limit)"
            if [ "$size" -gt "$limit" ]; then
              echo "::error file=$crate::$(basename "$crate") is $size bytes, above the crates.io limit of $limit"
              status=1
            elif [ "$size" -gt "$warn" ]; then
              echo "::warning file=$crate::$(basename "$crate") is $size bytes, $percent% of the crates.io limit"
            fi
          done
          exit $status

  deny:
    name: Licences, advisories, bans and sources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # deny.toml sets the policy and resolves the graph with all features.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  semver:
    name: Semver checks (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Informational until the API settles: a 0.x minor bump may break, and
    # the report shows what a release would break.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      # Compares every publishable crate with its latest crates.io release.
      - uses: obi1kenobi/cargo-semver-checks-action@v2

  windows:
    name: Windows checks
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-features --locked
      - run: cargo test -p kekule-potentials --no-default-features --locked
      - run: python -m unittest discover -s benchmarks/tests -p "test_*.py"

  fuzz-smoke:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      - name: Seed SMILES with the supplied PubChem smoke inputs
        run: |
          cp crates/kekule/tests/fixtures/corpus/smoke/data/pubchem_smiles/*.txt fuzz/corpus/smiles/
          mkdir -p fuzz/corpus/resonance
          cp crates/kekule/tests/fixtures/corpus/smoke/data/pubchem_smiles/*.txt fuzz/corpus/resonance/
      - name: Run every registered target
        shell: bash
        run: |
          seed=0
          cargo +nightly fuzz list | while read -r target; do
            seed=$((seed + 1))
            cargo +nightly fuzz run "$target" -- -runs=256 -max_len=4096 -seed="$seed"
          done
      - name: Preserve fuzz failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-smoke-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 7
