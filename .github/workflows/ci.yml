name: CI

permissions:
  contents: read

on:
  # Automatic GitHub-hosted CI is paused while repository Actions compute is
  # unavailable. Run the repository checks locally before integration.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Linux checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo test --workspace --all-features --doc --locked
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked
      - name: Check packaged license copies
        run: |
          for package in kekule kekule-potentials kekule-traj; do
            cmp LICENSE-APACHE "crates/$package/LICENSE-APACHE"
            cmp LICENSE-MIT "crates/$package/LICENSE-MIT"
          done
      - run: cargo package -p kekule --locked
      # Full companion packaging resolves `kekule` through crates.io and is
      # enabled only after the foundational crate is published. Until then,
      # validate each exact package file set.
      - run: cargo package -p kekule-potentials --locked --list
      - run: cargo package -p kekule-traj --locked --list
      - run: cargo xtask dashboard --check
      - run: cargo xtask skills --check

  fuzz-smoke:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@cargo-fuzz
      - name: Run every registered target
        shell: bash
        run: |
          seed=0
          cargo +nightly fuzz list | while read -r target; do
            seed=$((seed + 1))
            cargo +nightly fuzz run "$target" -- -runs=256 -max_len=4096 -seed="$seed"
          done
