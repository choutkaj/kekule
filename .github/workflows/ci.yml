name: CI

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msrv:
    name: Minimum supported Rust (1.89)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89.0
      - run: cargo check --workspace --all-targets --all-features --locked

  checks:
    name: Linux checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: cargo check --manifest-path fuzz/Cargo.toml --bins --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo test --workspace --all-features --doc --locked
      - name: Check atomic-data generator output paths
        run: python3 -m unittest discover -s tools/atomic-data -p test_generate.py
      - name: Check benchmark dashboard report handling
        run: python3 -m unittest discover -s benchmarks -p test_dashboard.py
      - name: Check SMARTS comparison contract and fixture provenance
        run: python3 -m unittest discover -s benchmarks -p test_smarts_conformance.py
      - name: Check independent mass-analysis logic
        run: python3 -m unittest discover -s benchmarks -p test_analyze_masses.py
      - name: Check external query corpus provenance
        run: python3 -m unittest discover -s benchmarks -p test_query_corpus.py
      - name: Check external structure corpus provenance
        run: python3 -m unittest discover -s benchmarks -p test_structure_corpus.py
      - name: Check SMARTS behavioral benchmark provenance
        run: python3 -m unittest discover -s benchmarks -p test_query_smarts.py
      - name: Check independent reference runner contracts
        run: python3 -m unittest discover -s benchmarks/reference -p test_runner.py
      - name: Check benchmark dashboard live updates
        run: node benchmarks/test_dashboard.cjs
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked
      - run: cargo test -p kekule-potentials --no-default-features --locked
      - run: RUSTDOCFLAGS="-D warnings" cargo doc -p kekule-potentials --no-default-features --no-deps --locked
      - name: Check packaged license copies
        run: |
          for package in kekule kekule-potentials kekule-traj; do
            cmp LICENSE-APACHE "crates/$package/LICENSE-APACHE"
            cmp LICENSE-MIT "crates/$package/LICENSE-MIT"
          done
      - run: cargo package -p kekule --locked
      # Full companion packaging resolves `kekule` through crates.io and is
      # enabled only after the foundational crate is published. Until then,
      # validate each exact package file set.
      - run: cargo package -p kekule-potentials --locked --list
      - run: cargo package -p kekule-traj --locked --list

  windows:
    name: Windows checks
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-features --locked
      - run: cargo test -p kekule-potentials --no-default-features --locked
      - run: python -m unittest discover -s benchmarks -p test_dashboard.py
      - run: python -m unittest discover -s benchmarks/reference -p test_runner.py

  fuzz-smoke:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      - name: Seed SMILES with the supplied PubChem smoke inputs
        run: cp benchmarks/corpora/smoke/data/pubchem_smiles/*.txt fuzz/corpus/smiles/
      - name: Run every registered target
        shell: bash
        run: |
          seed=0
          cargo +nightly fuzz list | while read -r target; do
            seed=$((seed + 1))
            cargo +nightly fuzz run "$target" -- -runs=256 -max_len=4096 -seed="$seed"
          done
      - name: Preserve fuzz failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-smoke-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 7
