[workspace]
resolver = "2"
members = [
    "crates/kekule",
    "crates/kekule-potentials",
    "crates/kekule-traj",
    "crates/kekule-openff",
    "crates/kekule-openff-ash",
    "benchmarks/observer",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.89"
repository = "https://github.com/choutkaj/kekule"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["chemistry", "cheminformatics", "bioinformatics", "molecular-modeling"]
categories = ["science", "data-structures", "parser-implementations"]

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.serde_json]
opt-level = 3

[profile.dev.package.memchr]
opt-level = 3

[profile.dev.package.zmij]
opt-level = 3

# NAGL inference and the bundled Ash model decode in test builds.
[profile.dev.package.matrixmultiply]
opt-level = 3

[profile.dev.package.ndarray]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3
