[package]
name = "kekule-potentials"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/kekule-potentials"
license.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
description = "Energy, gradient, and geometry-optimization machinery for topology-bound Kekule structures."
publish = true
# Integration tests (tests/) are not shipped.
include = ["/src/**", "/examples/**", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
default = ["openff", "ash"]
# OpenFF energies and gradients from a `kekule-openff` parameterization.
openff = ["dep:kekule-openff"]
# Bundles the Ash charge model required by the Rosemary preset (about 10 MB).
ash = ["openff", "kekule-openff/ash"]

[dependencies]
kekule.workspace = true
kekule-openff = { workspace = true, optional = true }

[[example]]
name = "openff_workflow"
required-features = ["ash"]

[[example]]
name = "clean_up"
required-features = ["ash"]
