[package]
name = "kekule-potentials"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
description = "Energy, gradient, and geometry-optimization machinery for topology-bound Kekule models."
publish = true

[features]
default = ["openff"]
openff = ["dep:kekule-openff"]

[dependencies]
kekule = { version = "0.3.0", path = "../kekule" }
kekule-openff = { version = "0.3.0", path = "../kekule-openff", optional = true }

[dev-dependencies]
kekule-traj = { version = "0.3.0", path = "../kekule-traj" }

[[example]]
name = "openff_workflow"
required-features = ["openff"]
