[package]
name = "kekule-potentials"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
description = "Concrete potential implementations for topology-bound Kekule structural views."
publish = true

[features]
default = ["dreiding"]
dreiding = ["dep:dreid-forge", "dep:dreid-kernel"]

[dependencies]
dreid-forge = { version = "=0.4.2", default-features = false, optional = true }
dreid-kernel = { version = "=0.4.2", optional = true }
kekule = { version = "0.2.0", path = "../kekule" }

[dev-dependencies]
kekule-traj = { version = "0.2.0", path = "../kekule-traj" }

[[example]]
name = "ligand_workflow"
required-features = ["dreiding"]
