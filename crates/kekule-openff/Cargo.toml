[package]
name = "kekule-openff"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
description = "SMIRNOFF parameter assignment and native NAGL inference for Kekule."
readme = "README.md"

[features]
default = ["ash"]
# Bundles the Ash charge model required by the Rosemary preset (about 10 MB).
ash = ["dep:kekule-openff-ash", "dep:flate2"]

[dependencies]
kekule = { version = "0.2.1", path = "../kekule" }
kekule-openff-ash = { version = "0.2.1", path = "../kekule-openff-ash", optional = true }
flate2 = { version = "1", optional = true }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ndarray = "0.16"

[dev-dependencies]
flate2 = "1"

[[example]]
name = "parameterize"
required-features = ["ash"]
