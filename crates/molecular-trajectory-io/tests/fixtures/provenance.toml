schema_version = 1

[policy]
purpose = "Small redistributable interoperability fixtures for trajectory codec regression tests"
required_fields = [
    "format",
    "variant",
    "generator",
    "generator_version",
    "generator_command",
    "source_revision",
    "sha256",
    "license",
    "atom_count",
    "frame_count",
    "fields",
    "native_units",
]
notes = """
Fixture payloads are added only with complete pinned provenance. Generator
tools are development references, never Molecular runtime dependencies.
Writer interoperability observations record the independent reader and exact
version used; they do not claim broad format parity.
"""

[[fixture]]
path = "ase-3.26.0-water.xyz"
format = "xyz"
variant = "strict multi-frame XYZ"
generator = "Atomic Simulation Environment (ASE)"
generator_version = "3.26.0"
generator_command = "uv run --python 3.12 --with ase==3.26.0 python generate_xyz.py"
source_revision = "6c965f46a9449cbea275a6cc11fefb82da7df4bf"
sha256 = "91c41f2f0b02034c507bf564dc4084be991f4cc21418604fcb4864e0f2e805ea"
license = "MIT repository fixture; ASE generator is LGPL-2.1-or-later"
atom_count = 3
frame_count = 2
fields = ["positions", "element symbols"]
native_units = "angstrom"
coverage = ["multi-frame element order", "negative and positive decimal coordinates"]

[[fixture]]
path = "mdanalysis-2.9.0-three-atoms.dcd"
format = "dcd"
variant = "CHARMM-compatible little-endian DCD with unit cell"
generator = "MDAnalysis"
generator_version = "2.9.0"
generator_command = "uv run --python 3.12 --with MDAnalysis==2.9.0 python generate_dcd.py"
source_revision = "908317e1d5be7c9129c149495f16585667ed83f1"
sha256 = "baabffaca935dff654d1466fe43ba469fb0b1b84d077b6afc3c10f5208cc7d0e"
license = "MIT repository fixture; MDAnalysis generator is GPL-2.0-or-later"
atom_count = 3
frame_count = 2
fields = ["positions", "unit cell", "step", "header delta"]
native_units = "angstrom; DCD DELTA left uninterpreted without an explicit reader policy"
coverage = ["little endian", "unit cell", "two frames"]

[[writer_observation]]
format = "dcd"
writer = "molecular-trajectory-io dcd_interop_writer example"
independent_reader = "MDAnalysis"
reader_version = "2.9.0"
reader_source_revision = "908317e1d5be7c9129c149495f16585667ed83f1"
command = "cargo run -p molecular-trajectory-io --example dcd_interop_writer -- OUTPUT.dcd; uv run --python 3.12 --with MDAnalysis==2.9.0 python -c <two-frame position/cell assertions>"
verified = ["frame count", "positions", "triclinic cell"]

[[planned_source]]
format = "trr"
generators = ["GROMACS", "independent XDR reader/writer"]
coverage = ["f32", "f64", "triclinic cell", "velocities", "forces", "time", "step", "lambda"]

[[planned_source]]
format = "xtc"
generators = ["GROMACS", "independent XTC reader/writer"]
coverage = ["1995 magic", "2023 magic", "small atoms", "compressed atoms", "triclinic cell", "precision"]
