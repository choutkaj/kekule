[package]
name = "kekule-bench"
default-run = "kekule-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false
exclude = [
    "runs/**",
    "dashboard/index.html",
    "dashboard/dashboard-data.js",
    "dashboard/.dashboard.lock",
    "dashboard/*.tmp",
    ".dashboard-python",
    "corpora/*/data/**",
    "!corpora/smoke/data/**",
    "!corpora/rdkit-queries/data/**",
    "!corpora/rdkit-structures/data/**",
    "goldens/**",
    "!goldens/*/*.jsonl.meta.json",
    "!goldens/smoke/*.jsonl.gz",
    "!goldens/rdkit-queries/*.jsonl.gz",
    "!goldens/rdkit-structures/*.jsonl.gz",
]

[dependencies]
flate2 = "1"
indicatif = "0.18"
rayon = "1.11"
kekule = { path = "../crates/kekule" }
kekule-openff = { path = "../crates/kekule-openff" }
potentials = "=0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
[dev-dependencies]
toml = "0.9"
